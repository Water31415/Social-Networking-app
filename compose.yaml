services:
  snapit:
    build: .
    image: snapit:local
    init: true
    restart: unless-stopped
    env_file:
      - Backend/.env.production
    environment:
      NODE_ENV: production
      PORT: "5000"
      SERVE_FRONTEND: "true"
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
    ports:
      - "127.0.0.1:${SNAPIT_PORT:-8080}:5000"
    volumes:
      - uploads:/app/Backend/uploads/images
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on:
      snapit:
        condition: service_healthy
    environment:
      SNAPIT_DOMAIN: ${SNAPIT_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  uploads:
  caddy_data:
  caddy_config:
